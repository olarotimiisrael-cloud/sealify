name: Sealify CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CLOUDFLARE_PROJECT_NAME: sealify
  PRODUCTION_URL: https://sealify.pages.dev

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate package manager files
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript validation
        run: npm run typecheck

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate package manager files
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          test -d dist
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist

      - name: Verify build artifact
        run: |
          test -d dist
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          branch: preview-${{ github.event.pull_request.number }}
          wranglerVersion: '3'

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sealify.pages.dev
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist

      - name: Verify build artifact
        run: |
          test -d dist
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Deploy Cloudflare Pages production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          branch: main
          wranglerVersion: '3'

      - name: Publish deployment summary
        run: |
          {
            echo "## Sealify production deployment"
            echo ""
            echo "Deployment completed for commit \`${GITHUB_SHA}\`."
            echo ""
            echo "Production URL: ${PRODUCTION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
