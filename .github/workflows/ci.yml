name: Sealify CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  CLOUDFLARE_PROJECT_NAME: "sealify"
  PRODUCTION_URL: "https://sealify.pages.dev"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate package manager files
        run: |
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json was not found."
            echo "This workflow uses npm ci, so package-lock.json must exist."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate package manager files
        run: |
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json was not found."
            echo "This workflow uses npm ci, so package-lock.json must exist."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory does not exist."
            exit 1
          fi

          if [ -z "$(find dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "❌ Build failed: dist directory is empty."
            exit 1
          fi

          echo "✅ Build output verified."
          echo "📦 Contents of dist:"
          find dist -maxdepth 2 -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist

      - name: Verify downloaded artifact
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist directory was not downloaded."
            exit 1
          fi

          echo "✅ Preview artifact verified."
          find dist -maxdepth 2 -type f | sort

      - name: Deploy to Cloudflare Pages Preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          branch: preview-${{ github.event.pull_request.number }}
          wranglerVersion: "3"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://sealify.pages.dev

    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sealify-dist-${{ github.sha }}
          path: dist

      - name: Verify production artifact
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist directory was not downloaded."
            exit 1
          fi

          if [ -z "$(find dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "❌ dist directory is empty."
            exit 1
          fi

          echo "✅ Production artifact verified."
          echo "📦 Files:"
          find dist -maxdepth 2 -type f | sort

      - name: Deploy to Cloudflare Pages Production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          branch: main
          wranglerVersion: "3"

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "       SEALIFY DEPLOYMENT SUCCESS"
          echo "========================================"
          echo ""
          echo "✅ Build completed"
          echo "✅ Artifact verified"
          echo "✅ Cloudflare Pages deployment completed"
          echo ""
          echo "🌐 Production URL:"
          echo "${{ env.PRODUCTION_URL }}"
          echo ""
          echo "📌 Commit:"
          echo "${{ github.sha }}"
          echo "========================================"
