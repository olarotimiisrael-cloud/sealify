name: Sealify Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript validation
        run: npm run typecheck

  build-and-deploy:
    name: Build & Deploy to Cloudflare Worker
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://sealify-api.onrender.com

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -d dist/assets

      - name: Install Wrangler 4
        run: npm install --no-save wrangler@4.129.0

      - name: Verify Wrangler
        run: |
          npx wrangler --version
          VERSION="$(npx wrangler --version | head -n 1)"
          echo "Detected Wrangler version: $VERSION"
          case "$VERSION" in
            4.*) echo "Wrangler 4.x confirmed" ;;
            *) echo "Expected Wrangler 4.x but found: $VERSION" >&2; exit 1 ;;
          esac

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
