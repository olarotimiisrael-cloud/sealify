name: Sealify Cloudflare Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.16.0'

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate package manager files
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://sealify.pages.dev
          NODE_ENV: production

      - name: Verify dist
        run: |
          if [ ! -d dist ]; then
            echo "::error file=dist::Build output directory is missing"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "::error file=dist/index.html::Build output is missing dist/index.html"
            exit 1
          fi
          if [ ! -d dist/assets ]; then
            echo "::error file=dist/assets::Build output is missing dist/assets"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          quiet: false
          command: pages deploy dist --project-name=sealify --branch=main
