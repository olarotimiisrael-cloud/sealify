app = "sealify"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  APP_DEBUG = "false"
  VITE_API_BASE = "/api"

[mounts]
  source = "sealify_data"
  destination = "/var/www/html/database"

[processes]
  app = "apache2-foreground"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
