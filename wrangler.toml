name = "sealify-nigeria"
main = "src/entry-server.tsx"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[env]
# These are set in Cloudflare Dashboard → Settings → Environment Variables
# NODE_VERSION = "20"
# NODE_ENV = "production"

[vars]
# App config
APP_NAME = "Sealify Nigeria"
APP_URL = "https://sealify.ng"

# Supabase (set as secrets in dashboard)
# NEXT_PUBLIC_SUPABASE_URL = ""
# SUPABASE_ANON_KEY = ""
# SUPABASE_SERVICE_ROLE_KEY = ""

# Payment providers (set as secrets)
# FLUTTERWAVE_SECRET_KEY = ""
# PAYSTACK_SECRET_KEY = ""
# MONNIFY_SECRET_KEY = ""

# Email service (set as secrets)
# RESEND_API_KEY = ""
# SENDGRID_API_KEY = ""

# Push notifications (set as secrets)
# VAPID_PRIVATE_KEY = ""
# VAPID_PUBLIC_KEY = ""

# Analytics (set as secrets)
# SENTRY_DSN = ""
# POSTHOG_KEY = ""

[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-id"

[[d1_databases]]
binding = "DB"
database_name = "sealify-analytics"
database_id = "your-d1-database-id"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "your-hyperdrive-config-id"